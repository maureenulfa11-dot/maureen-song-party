<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Song Party — Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-bg">
  <div class="overlay">
    <div class="top-left">
      <button id="start-hosting" class="ghost-btn">Start Hosting</button>
    </div>
    <div class="center-join">
      <input id="join-code" placeholder="Enter room code" />
      <button id="join-btn">Join</button>
    </div>
    <div class="qr-area">
      <img id="qr-img" alt="room qr" />
      <div class="qr-caption">Scan to join</div>
    </div>
  </div>

  <script src="musicLibrary.js"></script>
  <script src="app.js"></script>
</body>
</html>
