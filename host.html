<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Song Party — Host</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="host-container">
    <header class="host-header card">
      <div>
        <h1 id="host-title">Host Lobby</h1>
        <div class="room-code">Room <strong id="room-code">----</strong></div>
      </div>
      <div class="host-actions">
        <div id="qr-area"></div>
        <button id="btn-end" class="btn secondary">End Game</button>
      </div>
    </header>

    <section class="host-main">
      <aside class="panel card">
        <h3>Players</h3>
        <ul id="players-list" class="player-list"></ul>
        <div class="host-controls">
          <button id="btn-start-game" class="btn primary">Start Game</button>
          <button id="btn-next-round" class="btn">Next Round</button>
        </div>
      </aside>

      <section class="stage card">
        <div id="host-music" class="host-music"></div>
        <div id="round-panel" class="round-panel"></div>
        <div id="leaderboard" class="leaderboard"></div>
      </section>
    </section>

  </main>

  <script src="env.example.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
