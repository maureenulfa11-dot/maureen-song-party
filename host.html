<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Song Party — Host Lobby</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="host-lobby-bg">
  <div class="overlay">
    <div class="lobby-panel">
      <h1 id="room-code">ROOM</h1>
      <div class="lobby-actions">
        <button id="copy-code" class="ghost-btn">Copy</button>
        <button id="start-game" class="primary-btn">Start Game</button>
      </div>
      <div class="qr-area small">
        <img id="lobby-qr" alt="room qr" />
        <div class="qr-caption">Scan to join</div>
      </div>
      <div id="players-list"></div>
    </div>
  </div>

  <!-- Host-only YouTube player. Only shown when host is in game mode -->
  <div id="host-player" class="host-player hidden">
    <iframe id="yt-iframe" width="560" height="315" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>

  <script src="musicLibrary.js"></script>
  <script src="app.js"></script>
</body>
</html>
