<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Song Party — Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="player-container card">
    <header>
      <h2 id="player-room">Room —</h2>
    </header>

    <div id="join-panel" class="join-panel">
      <label>Nickname</label>
      <input id="nick" placeholder="Your nickname" />
      <label>Room code</label>
      <input id="join-room" placeholder="ROOMCODE" />
      <div class="row">
        <button id="btn-join-room" class="btn primary">Join</button>
        <button id="btn-qr-scan" class="btn">Show QR</button>
      </div>
    </div>

    <div id="waiting" class="hidden card">
      <h3>Waiting for host...</h3>
      <p id="wait-info">Players will appear in the host lobby.</p>
    </div>

    <div id="question-card" class="hidden card">
      <div id="question-text" class="question-text"></div>
      <div id="choices" class="choices"></div>
    </div>

    <div id="player-leaderboard" class="card leaderboard"></div>

  </main>

  <script src="env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
