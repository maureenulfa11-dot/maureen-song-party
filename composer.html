<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Song Party — Quick Create</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="artboard" id="composer-artboard">
    <img src="IMG_8340.jpeg" alt="Composer mockup artboard" id="composer-img">

    <!-- Tabs -->
    <button class="hotspot" id="hot-tab-fill" style="top:12%;left:14%;width:18%;height:6%" aria-label="Fill tab"></button>
    <button class="hotspot" id="hot-tab-guess" style="top:12%;left:34%;width:18%;height:6%" aria-label="Guess tab"></button>

    <!-- Inputs (styled to blend in). These are positioned over the mockup fields. -->
    <input id="input-song-source" class="invisible-input" style="top:28%;left:12%;width:62%;height:6%" placeholder="Song source" aria-label="Song source">
    <select id="select-genre" class="invisible-input" style="top:36%;left:12%;width:30%;height:6%" aria-label="Genre">
      <option value="pop">Pop</option>
      <option value="rock">Rock</option>
      <option value="hiphop">Hip Hop</option>
    </select>
    <select id="select-blanks" class="invisible-input" style="top:36%;left:44%;width:16%;height:6%" aria-label="Number of blanks">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
    </select>

    <!-- Action hotspots that look invisible but are clickable over existing mockup buttons -->
    <button class="hotspot" id="hot-auto-create" style="top:60%;left:12%;width:28%;height:10%" aria-label="Auto Create"></button>
    <button class="hotspot" id="hot-save-round" style="top:60%;left:42%;width:28%;height:10%" aria-label="Save Round"></button>

  </main>

  <script src="musicLibrary.js"></script>
  <script src="app.js"></script>
</body>
</html>
